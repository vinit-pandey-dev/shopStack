# ===== Application =====
spring.application.name=ecommerce

# ===== MySQL (default profile) =====
# Each value reads from an environment variable first; the part after the colon is the local fallback.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
# CHANGED: Railway variable is DB_USER (was DB_USERNAME)
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# CHANGED: SQL logging off by default (set SHOW_SQL=true to see it)
spring.jpa.show-sql=${SHOW_SQL:false}
# CHANGED: hibernate.dialect line removed; Hibernate detects MySQL / H2 itself

# ===== JWT =====
# In production, set JWT_SECRET as an environment variable (Railway already has it).
app.jwt.secret=${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JKV1RTaWduaW5nMTIzNDU2}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Admin (NEW: same variable the live app already uses) =====
app.admin.password=${ADMIN_PASSWORD:admin123}

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# ===== Server =====
server.port=${PORT:8080}


spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.embeddings-path=/v1beta/openai/embeddings
spring.ai.openai.embedding.options.model=gemini-embedding-001
spring.ai.openai.embedding.options.dimensions=1536

spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX:shopstack}
spring.ai.vectorstore.pinecone.namespace=${PINECONE_NAMESPACE:shopstack}

app.ai.top-k=${AI_TOP_K:5}
# Tune this by reading the "Search:" log lines. Gemini scores may differ from OpenAI's.
app.ai.similarity-threshold=${AI_SIMILARITY_THRESHOLD:0.30}
app.ai.index-on-startup=${AI_INDEX_ON_STARTUP:true}
app.ai.rate-limit-per-minute=${AI_RATE_LIMIT:10}