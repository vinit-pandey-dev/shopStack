# ===== Application =====
spring.application.name=ecommerce

# ===== MySQL (default profile) =====
# Each reads from an environment variable first; the value after the colon
# is the local fallback used automatically when that env var isn't set,
# so this one file works unchanged on your laptop and in production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# In production, set JWT_SECRET to your own long random value (don't reuse this one) —
# e.g. `openssl rand -base64 48` — as an environment variable on your hosting platform.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS (frontend origin) =====
# Add your deployed frontend's URL here once you have it, comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# ===== Server =====
# Most hosts (Railway, Render, Heroku) inject their own $PORT — this falls back to 8080 locally.
server.port=${PORT:8080}

# ===== AI assistant (RAG) =====
# Generation uses the Anthropic Messages API. Get a key at https://console.anthropic.com and set it as an
# environment variable - never commit it. Without it, the chat endpoint answers 503 and everything else works.
app.ai.provider=${AI_PROVIDER:anthropic}
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}

# Optional: real semantic embeddings from Voyage AI (https://www.voyageai.com). Without a key the app falls
# back to a local keyword (TF-IDF) retriever, which works offline but matches words, not meaning.
app.ai.voyage-api-key=${VOYAGE_API_KEY:}
app.ai.embedding-model=${VOYAGE_MODEL:voyage-4-lite}

app.ai.top-k=${AI_TOP_K:4}
app.ai.min-score=${AI_MIN_SCORE:0.01}
app.ai.rate-limit-per-minute=${AI_RATE_LIMIT:10}
app.admin.password=${ADMIN_PASSWORD:admin123}